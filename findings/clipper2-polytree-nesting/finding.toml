notes = "Confirmed at triage; not yet reported (FINAL.md is the drafted report). A remaining case of the regression #973 reported: #973 had the same symptom (a hole at the top level) from the same commit e8ebdef, and its fix (0d0ba0f/927daf7) repaired that input but kept the return false, so FINAL.md is framed as a follow-up to #973. Not a duplicate: no open or closed issue or PR has this input (20 open issues, #1058-#1112, checked 2026-09-26). #942 is an earlier nesting bug with a different mechanism; open #1084 (C#, no data) is loosely related at most; #1008 / Discussion #1022 is valid but non-canonical output, where Angus declined tweaks to results that correctly describe the filled regions, so FINAL.md stresses that the PolyTree ownership contract, not the region, is broken; open PR #1101 still reproduces. Severity: wrong structure, not wrong region. The rings, the flat Paths64 result and the tree's signed-area sum are exact; only PolyTree parent links are wrong, so the error is gross only for code that reads the tree (OGC-read area 20 vs 12 on the minimal case, 4166 vs 2010 on a lead case) and shows up as overlay results that are wrong when read as OGC polygons (adapter), not in v1 areas. Clipper2's own tests miss it: CheckPolytreeFullyContainsChildren only checks nodes that have children, and TestPolytreeHoles2 compares signed areas. The 93 % fuzz figure holds within a deliberately degenerate family (every vertex of B on A's boundary). Lead case hole-contact-7-000044 is the rounding variant (one island vertex snapped just outside its hole) of the same return false. C# port keeps the old midpoint fallback (probably unaffected); Delphi has the same Exit (probably affected); neither was run. The PolyTree64 doc sentences came through web search and the #957 text only (angusj.com and web.archive.org blocked in the sandbox): FINAL.md cites only clipper.engine.h and IsHole(); check the docs in a browser before citing them. The 3 other adapter nesting/orientation mismatches on the 1804-case set (int-grid-7-000041, tiny-rotation-1-000108/179) and the fuzz near-miss (A=(-51,59)(-41,24)(-26,-21), B=(-49,52)(-37,12)(-41,27): Difference 16.5, exact 27.5) are flat-result integer-grid effects, not this finding, untriaged."
