notes = "Confirmed at triage; not yet reported (FINAL.md is the drafted report). New: no open or closed issue or PR has this input; #957/#973 are the fixes that introduced it, #942 an earlier, different nesting bug; open PR #1101 still reproduces. The rings and the even-odd area are exact; only PolyTree parent links are wrong, so the finding shows up as overlay results that are wrong when read as OGC polygons (adapter), not in v1 areas. Lead case hole-contact-7-000044 is the rounding variant (one island vertex snapped just outside its hole) of the same return-false. C# port keeps the old midpoint fallback (probably unaffected); Delphi has the same Exit (probably affected); neither was run. The PolyTree64 doc quote came through web search only (angusj.com blocked in the sandbox): check it before citing. The 3 other adapter nesting/orientation mismatches on the 1804-case set (int-grid-7-000041, tiny-rotation-1-000108/179) and the fuzz near-miss (A=(-51,59)(-41,24)(-26,-21), B=(-49,52)(-37,12)(-41,27): Difference 16.5, exact 27.5) are flat-result integer-grid effects, not this finding, untriaged."
