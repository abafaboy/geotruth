[[finding]]
id = "clipper2-polytree-nesting"
library = "clipper2"
lib = "clipper2@2.0.1-f9c5eb6"
signature = "overlay (PolyTree64/PolyTreeD nesting): a result ring whose every vertex lies on the boundary of the ring containing it is put one level too high: an inscribed hole becomes a second top-level node (IsHole false, clockwise), an inscribed island becomes a second hole (IsHole true, counter-clockwise); the flat Paths64 result is right. Path2ContainsPath1 (clipper.h:739) returns false when no vertex is strictly inside, so RecursiveCheckOwners (clipper.engine.cpp:2958-2981) drops the correct owner; also when one vertex is rounded just outside. Regression from e8ebdef (#957 fix), since 1.5.3"
fields = ["overlay.difference", "overlay.symdifference", "overlay.union"]
families = ["vertex-on-edge", "hole-contact"]
status = "confirmed"
status_date = "2026-09-26"
