notes = "Regression 3.13.0 -> 3.13.1 (GH-1201 = port of jts#1099, backported to 3.13 as 782bec07). No duplicate found in libgeos/geos or locationtech/jts. covered-ring/FINAL.md (GEOS) and covered-ring/JTS_FINAL.md are ready, not posted. Related: geos-multipolygon-touching-parts-predicates (ring-touch-node) has the same missing-section mechanism; its polygon/polygon cases fail on 3.13.0 as well, but its polygon/LINE cases (e.g. the hole-touch vs edge case in tests/crosscheck/test_witness_vs_geos.py) were correct in 3.13.0 and are exposed by this regression. The gc-overlapping-polygons class of tests/crosscheck is also correct in 3.13.0 when the GC is operand B. The fix trades against GH-1201's prepared-mode caching; the experiment diff is not a proposed patch."
