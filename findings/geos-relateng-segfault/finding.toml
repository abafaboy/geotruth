signature = "relate/predicates: SIGSEGV when a GeometryCollection operand contains an EMPTY element: (1) POLYGON EMPTY + a located point on >= 2 polygon boundaries -> AdjacentEdgeLocator::addSections loops to SIZE_MAX over the 0-point shell (AdjacentEdgeLocator.cpp:67-68); (2) GC whose declared dimension comes from an empty LineString, related to an empty operand -> TopologyComputer::initExteriorEmpty (TopologyComputer.cpp:95,101) calls hasBoundary on a null LinearBoundary (RelatePointLocator.cpp:70). Same declared-vs-real dimension cause gives wrong exterior entries without a crash (EMPTY_ELEMENT_DIMENSION)."
