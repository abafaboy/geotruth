notes = "New bug; no duplicate found in libgeos/geos, locationtech/jts or shapely/shapely (open and closed). FINAL.md (GEOS) and JTS_FINAL.md (JTS, NPE + wrong IM) are ready but not posted. Prototype fix (prototype_fix.diff: skip empty polygons in AdjacentEdgeLocator::addRings; TopologyComputer::getDimension returns getDimensionReal) passes GEOS ctest 535/535 and JTS relateng JUnit 154/154, removes all 13 crashes of a 25,000-case regeneration and changes no previously exact answer. The pinned GEOS_CRASHES and EMPTY_ELEMENT_DIMENSION cases in tests/crosscheck/test_relate_dual.py belong to this finding, and so does the leads.toml lead relateng-empty-operand-type-dimension (POINT EMPTY vs GC(POLYGON EMPTY, LINESTRING): FFFFFF212, exact FFFFFF102; same initExteriorEmpty declared-dimension cause, fixed by the same patch; case lead-relateng-empty-operand-type-dimension in cases.jsonl). The finding did not grow out of that lead (it came from GEOS_CRASHES), but it subsumes it. The lead relateng-gc-polygon-with-exterior-point is a different defect (no EMPTY element; unchanged by the patch). families: the corpus family \"empty\" is where the subsumed lead's case comes from (corpus/cases/core/empty.jsonl); the crashes themselves were found by the adversarial generator of tools/crosscheck_relate.py (13 in 25,000 cases), which is not a corpus family. cases.jsonl and scan_crashes.jsonl are v2 typed-JSON case records (geotruth.io.case_from_json reads them) with the WKT kept in a_wkt/b_wkt. GEOS 3.13.0 itself was not run; PostGIS was not tested."
