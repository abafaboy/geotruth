# Registry snippet for findings/registry.toml (not merged there; same keys as registry entries).

[[finding]]
id = "geos-relateng-segfault"
library = "geos-main"
lib = "geos@3.16.0dev-ae9cdd9"
signature = "relate/predicates (RelateNG): SIGSEGV when a GeometryCollection operand contains an EMPTY element: (1) POLYGON EMPTY + a located point on >= 2 polygon boundaries -> AdjacentEdgeLocator::addSections loops to SIZE_MAX over the 0-point shell (AdjacentEdgeLocator.cpp:67-68); the full-matrix entry points crash (relate, relate with a boundary node rule, prepared relate), relatePattern unless it can decide first, and so does each named predicate that reaches the point before deciding (which ones depends on the operand: for the point case intersects, disjoint, touches, crosses, within, covered_by, contains(B,A), covers(B,A) and prepared forms; equals and overlaps do not crash); (2) GC whose declared dimension comes from an empty LineString, related to an empty operand -> TopologyComputer::initExteriorEmpty (TopologyComputer.cpp:95,101) calls hasBoundary on a null LinearBoundary (RelatePointLocator.cpp:70); every full-matrix or pattern entry point crashes (relate, relate with a boundary node rule, prepared relate, relatePattern unless the empty operand decides the pattern early, e.g. FF*FF**** crashes and T******** does not); the named predicates short-circuit and do not crash. In RelateNG the same declared-vs-real dimension cause gives wrong exterior entries without a crash (EMPTY_ELEMENT_DIMENSION); that wrong matrix is not a RelateNG regression (GEOS 3.11.4 RelateOp gives the same)."
fields = ["relate", "predicates.intersects", "predicates.disjoint", "predicates.touches", "predicates.crosses", "predicates.overlaps", "predicates.contains", "predicates.covers", "predicates.within", "predicates.covered_by"]
families = ["empty"]
status = "confirmed"
status_date = "2026-09-26"
priority = "high"
