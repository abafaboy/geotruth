# Registry snippets for findings/registry.toml (not merged there; same keys as registry entries).
# The lead "geos-relateng-geometrycollection-semantics" splits into three independent RelateNG
# defects, one [[finding]] each. All three share this directory (cases.jsonl, repro.*, ISSUE.md);
# each has its own report. The lead's other two classes are covered by existing findings:
# gc-overlapping-polygons = geos-relateng-line-end-skip/covered-ring (GH-1201 regression),
# empty-element-dimension = geos-relateng-segfault (case 3). See ISSUE.md section 8.

[[finding]]
id = "geos-relateng-geometrycollection-semantics/d1-mixed-gc-exterior-inference"
library = "geos-main"
lib = "geos@3.16.0dev-ae9cdd9"
signature = "relate and predicates (RelateNG), mixed GeometryCollections: TopologyComputer::addPointOnGeometry (TopologyComputer.cpp:332-339) records Exterior x Interior = 2 and Exterior x Boundary = 1 for a Point element and an areal target even when the point is in the target's exterior (valid only for a puntal source), and addLineEndOnGeometry (359-360) records nothing for a line end on a Point element of a mixed target (Interior x Exterior = 1 lost): GC(square [0,4]^2, POINT (10 10)) vs square [1,2]^2 gives 212FF1212 (exact 212FF1FF2, contains false); LINESTRING (0 0, 1 0, 0 1, 0 0) is within GC(POINT (0 0), LINESTRING (5 5, 6 6)) (0FFFFF102, exact 0F1FFF102)"
fields = ["relate", "predicates.contains", "predicates.covers", "predicates.within", "predicates.covered_by", "predicates.overlaps", "predicates.crosses"]
families = ["gc", "witness-lattice:GC", "sweep:mix", "sweep:mix2"]
status = "confirmed"
status_date = "2026-09-26"
verified_on = [
    "GEOS main ae9cdd98be4e0bae552b918d4d14c94a9ce99c58 and 3.15.0 (d0228513abb0c29c185443cf2bfb06c9281024b5): wrong",
    "GEOS 3.14.1 (Shapely 2.2.0rc1 wheel), 3.13.1 (Shapely 2.1.2 wheel), 3.13.0 (d7957246, source build): wrong",
    "GEOS 3.11.4 (Shapely 2.0.7 wheel, RelateOp): polygon+point cases correct, line-end cases wrong differently",
    "JTS master 3ea61f8cf2103f454c9cf3962df75fb6ef3ebecd and 1.20.0 (6e95fe82), RelateNG: identical wrong matrices",
    "GEOS main + prototype_fix_1.diff: ctest 535/535; 689 of 33,719 sweep answers corrected, none broken",
]
cases = "findings/geos-relateng-geometrycollection-semantics/cases.jsonl"
repro = "findings/geos-relateng-geometrycollection-semantics/repro.c"
evidence = "findings/geos-relateng-geometrycollection-semantics/FINAL.md"
links = [
    "https://github.com/libgeos/geos/blob/ae9cdd98be4e0bae552b918d4d14c94a9ce99c58/src/operation/relateng/TopologyComputer.cpp#L332-L339",
    "https://github.com/libgeos/geos/issues/1148",
