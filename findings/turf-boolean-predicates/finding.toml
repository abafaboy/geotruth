notes = "Confirmed at triage; not yet reported (FINAL.md is the drafted report for Turfjs/turf). It contradicts booleanTouches' own doc ('true if none of the points common to both geometries intersect the interiors of both geometries') and the JSTS/Shapely touches that the package's test.ts compares against. No tolerance is involved: booleanPointOnLine is called without epsilon, and the 5 minimal cases use small integers (all float arithmetic exact). The four Polygon/Polygon fixtures (two true, two false) all pass the small square as feature1, and test.ts runs one argument order. Core tier: 404 of 2000 areal pairs wrong, and 70 of 207 integer-coordinate pairs (60 false positives). No duplicate: #3088 (open PR) fixes only the LineString/MultiLineString branch. Related, not duplicates: #1467 (open) raises the same vertex-only concern for booleanContains, which #3104 (7.4.0, closing #2242) addressed with edge splitting in isPolyInPoly (#1467's own example is exactly contains = true, and Turf 7.4.0 returns true); #3109 (open, v8) plans to replace isPolyInPoly. The lead's other parts are not new bugs. booleanOverlap is true on any edge contact: known, #2454 (open). ISSUE.md drafts an optional comment for #2454's unreported sub-case, containment with a shared boundary ([0,2]^2 and [0,1]^2: booleanOverlap = true and booleanContains = true, exact 212F11FF2). booleanContains ignores holes: known, #1882, and #3109 plans the rewrite. booleanOverlap's geojsonEquality precision 6 and booleanContains' BOUNDARY_DISTANCE_TOLERANCE 1e-6 are by-design tolerances (RFC 7946 rationale in the source). A few near-miss touches/overlaps flips are float robustness, and Turf claims no exactness. Out of scope, noted in ISSUE.md: the MultiLineString/MultiPoint branch indexes lines with the MultiPoint index (L336, L344). An independent review's corrections were applied (7.0.0 re-run with pinned dependencies, L598/L753 root cause, hole wording, fixture count; see ISSUE.md). Nothing has been posted."
