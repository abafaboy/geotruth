# Registry snippet for findings/registry.toml (not merged there; same keys as registry entries).
# It replaces the [[lead]] entry "turf-touches-overlaps-vertex-rules" (status "unreviewed").

[[finding]]
id = "turf-boolean-predicates"
library = "turf"
lib = "turf@7.4.0"
signature = "booleanTouches, Polygon/MultiPolygon operands: decided from A's vertices only, and only from the first part of a MultiPolygon. Polygon/Polygon (index.ts L560-L581): touches = some vertex of A's outer ring on B's outer ring and no vertex of A strictly inside B; B's vertices, vertex-free interior overlap and holes as contact locations are never examined. So identical or overlapping polygons touch (POLYGON ((0 0, 1 0, 0 1, 0 0)) with itself: true, exact 2FFF1FFF2), and real touches are missed or depend on argument order (square [0,2]^2 and a triangle whose apex (1, 2) is on its top edge: touches(A, B) = false, touches(B, A) = true, exact FF2F01212). Polygon/MultiPolygon (L598) and MultiPolygon/MultiPolygon (L753) pass a single ring as a Polygon's coordinates, so the strictly-inside test never fires and A touches B as soon as a tested vertex of A lies on a ring of B's first part, even with A inside B (POLYGON ((2 0, 3 2, 1 2, 2 0)) and MULTIPOLYGON (((0 0, 4 0, 4 4, 0 4, 0 0))): true, exact 2FF10F212). MultiPolygon/MultiPolygon also bounds its vertex loop by the ring count (L731)"
fields = ["predicates.touches"]
families = ["hole-contact", "int-grid", "multi-touch", "near-collinear", "scaled", "shared-edge", "sliver-spike", "tiling-contact", "tiny-transform", "vertex-on-edge", "tiny-rotation", "shared-sloped-edge"]
status = "confirmed"
status_date = "2026-09-26"
verified_on = [
    "Turf master bec3ac7860d5d71a31bd9dbc44dd1ac5fab0c0b7 (head on 2026-09-26; packages/*/index.ts bundled with esbuild): 5/5 minimal cases wrong; the extra.mjs cases (L598, L753, L731, holes) as in output/extra-turf-master-bec3ac7.txt",
    "@turf/turf 7.4.0 (npm latest, tag v7.4.0 = 22acbd806adb80eece91b7fc43589d5d7788e815): 5/5 wrong; extra.mjs output identical to master",
    "@turf/boolean-touches 7.0.0, pinned (with @turf/boolean-point-on-line, boolean-point-in-polygon, helpers and invariant 7.0.0): 5/5 wrong",
    "@turf/boolean-touches 6.5.0: 5/5 wrong",
