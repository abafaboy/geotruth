[[finding]]
id = "geo-i-overlay-thin-polygon-collapse"
library = "rust-geo"
lib = "geo@0.33.1"
signature = "overlay (BooleanOps): the input is snapped to i_overlay's i32 grid (step 2^(round(log2 H) - 29), H the largest half-extent of the joint bounding box) before an exact integer overlay, so a valid polygon narrower than about one step collapses or is distorted: intersection(A, A) and union(A, A) of the 1 x 2e9 triangle POLYGON ((0 0, 1 0, 0 2000000000, 0 0)) are empty"
fields = ["overlay.intersection", "overlay.union", "overlay.difference", "overlay.symdifference"]
families = ["int-thin-triangle"]
status = "by-design"
status_date = "2026-09-26"
verified_on = [
    "geo main c12769fdf7453df1dd590e6e3bca28913d3c0564 (i_overlay 4.5.2): reproduces",
    "geo 0.33.1 (crates.io; i_overlay 4.5.2, i_float 1.16.0): reproduces",
    "i_overlay 9.0.0 directly: the default i32 engine reproduces, the i64 engine is exact",
]
cases = "findings/geo-i-overlay-thin-polygon-collapse/cases.jsonl"
repro = "findings/geo-i-overlay-thin-polygon-collapse/repro/src/main.rs"
evidence = "findings/geo-i-overlay-thin-polygon-collapse/ISSUE.md"
links = [
    "https://github.com/georust/geo/issues/1493",
    "https://github.com/georust/geo/discussions/1215",
    "https://github.com/georust/geo/discussions/1540",
    "https://github.com/georust/geo/pull/1234",
    "https://github.com/iShape-Rust/iOverlay/issues/26",
]
upstream_issue = ""
supersedes_lead = "geo-i-overlay-thin-triangle-collapse"
notes = "By design: the grid is i_overlay's precision model, which i_overlay documents and the geo maintainers know about (commit 4915dfc, discussion #1215), but geo's BooleanOps API documentation does not mention it. ISSUE.md holds a draft documentation/enhancement request for georust/geo (not posted), not a bug report. georust/geo#1493 (closed) shows the same mechanism in a mild form. The rust-geo adapter manifest's delta (grid) covers this behaviour. The repro crate is built and run by run.sh."

