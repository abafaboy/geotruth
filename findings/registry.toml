notes = "Confirmed at triage (ISSUE.md) and by an independent review; not yet reported. Severity: wrong matrix, not wrong predicate (relate, prepared relate, relatePattern). The line-end part is known upstream in JTS (locationtech/jts#1175, fixed by #1200, merged 2026-06-13; ported to NetTopologySuite as NTS #862 / PR #869, with PR #886 syncing the JTS XML test) but was never ported to GEOS, and no GEOS issue or PR exists, so the GEOS report is a port request, not a new discovery. The area-vertex part is new and unfixed in GEOS and JTS master; it overlaps with geos-relateng-geometrycollection-semantics (D3, same function and TODO at RelateNG.cpp:621): D3's vertex choice fixes les-5 but not the nested-squares case les-6, so both fixes are needed and the reports cross-reference each other. FINAL.md (GEOS: port #1200 plus the area-vertex fix; patch/area-vertex-skip.diff must be applied after patch/port-jts-1200.diff, whose Location alias it uses) and JTS_FINAL.md (area-vertex part only; in JTS it is reachable only through RelateNG or jts.relate=ng) are drafted. les-1 is the smallest non-degenerate case; les-1-degenerate-closed is a valid 5-coordinate variant. GEOS #1147/#1148/#1149, #1275, #983, #1022, #1027, #1064 and #1346 were checked and are different problems. The same triage found a second, separate cluster in covered-ring/: a GEOS 3.13.1 regression from GH-1201 (a port of locationtech/jts#1099) after which a linear or GeometryCollection operand B is no longer self-noded when A is polygonal, which makes contains, touches, covers and within wrong for valid polygon/line and polygon/GC pairs (covered-ring/FINAL.md, covered-ring/JTS_FINAL.md). It needs its own findings/ directory before it can have its own entry here; until then this note is its only registration (finding.toml holds the proposed entry)."

[[finding]]
id = "geos-relateng-segfault"
library = "geos-main"
lib = "geos@3.16.0dev-ae9cdd9"
signature = "relate/predicates (RelateNG): SIGSEGV when a GeometryCollection operand contains an EMPTY element: (1) POLYGON EMPTY + a located point on >= 2 polygon boundaries -> AdjacentEdgeLocator::addSections loops to SIZE_MAX over the 0-point shell (AdjacentEdgeLocator.cpp:67-68); the full-matrix entry points crash (relate, relate with a boundary node rule, prepared relate), relatePattern unless it can decide first, and so does each named predicate that reaches the point before deciding (which ones depends on the operand: for the point case intersects, disjoint, touches, crosses, within, covered_by, contains(B,A), covers(B,A) and prepared forms; equals and overlaps do not crash); (2) GC whose declared dimension comes from an empty LineString, related to an empty operand -> TopologyComputer::initExteriorEmpty (TopologyComputer.cpp:95,101) calls hasBoundary on a null LinearBoundary (RelatePointLocator.cpp:70); every full-matrix or pattern entry point crashes (relate, relate with a boundary node rule, prepared relate, relatePattern unless the empty operand decides the pattern early, e.g. FF*FF**** crashes and T******** does not); the named predicates short-circuit and do not crash. In RelateNG the same declared-vs-real dimension cause gives wrong exterior entries without a crash (EMPTY_ELEMENT_DIMENSION); that wrong matrix is not a RelateNG regression (GEOS 3.11.4 RelateOp gives the same)."
