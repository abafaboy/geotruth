# geotruth triage registry (DESIGN.md §0.4 and §5.4).
#
# One [[finding]] per directory under findings/: a failure cluster with its evidence. Where
# one triage found several related defects, they share the directory and its entry, and the
# signature or the notes name each of them. No automated disagreement is presented as a
# confirmed bug: every cluster carries a triage status, one of
#
#   unreviewed  found by the harness, not yet triaged by a person
#   confirmed   triaged: a wrong answer within the library's documented contract
#   by-design   triaged: documented or intended behaviour (not reported as a bug)
#   reported    confirmed and reported upstream (upstream_issue is set)
#   fixed       fixed upstream (fixed_in names the commit or release)
#
# Keys of a finding:
#   id              the directory under findings/ that holds the evidence
#   library         the adapter target id (adapters/*/adapter.toml [[target]].id)
#   lib             the `lib` string of the build the finding was made on
#   signature       what goes wrong, stated so that later disagreements can be matched to it
#   fields          result fields affected (score.v2 names: relate, predicates.<name>,
#                   valid_a / valid_b, overlay.<op>)
#   families        corpus families where the cluster shows up
#   status          see above; status_date is when it last changed
#   priority        optional; set only when triage gave a priority other than normal
#   verified_on     library versions or commits the minimal case was checked on, and the result
#   cases           minimal cases, one JSON line each (operands as typed JSON, FORMAT-v1
#                   coordinate lists or WKT); repro: standalone program
#   evidence        the triage write-up or the final report
#   links           upstream documentation, issues and discussions (notes say which related
#                   issues were checked and found to be different problems)
#   upstream_issue  URL of the report, once reported ("" otherwise); for a finding that turned
#                   out to be an existing upstream issue, that issue
#   fixed_in        for status "fixed": the release and the change that fixed it
#   supersedes_lead the corpus/curated/leads.toml lead this finding grew out of, if any
#   notes           anything a reader must know before citing the finding
#
# "Not yet reported" means exactly that: the upstream reports are drafted in each directory
# (ISSUE.md, FINAL.md, JTS_FINAL.md) and nothing has been posted.
#
# Documented candidate clusters without a findings/ directory are the leads of
# corpus/curated/leads.toml, which holds their cases and details. Each has a [[lead]] entry at
# the end of this file (status "unreviewed"), so that the registry lists every known cluster.
# A lead that triage turned into a finding keeps its cases in leads.toml (the curated tier
# keeps them) but has no [[lead]] entry here: the finding names it in supersedes_lead.
registry_version = 1

