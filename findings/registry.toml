oposes one entry per defect."

[[finding]]
id = "geos-relateng-line-end-skip"
library = "geos-main"
lib = "geos@3.16.0dev-ae9cdd9"
signature = "relate (RelateNG): the known-exterior skip in computeLineEnds and computeAreaVertex fires after the first element point found in the other operand's exterior even when that point is a Mod-2 interior line end (the start of a closed line, a shared end) or a GC area vertex inside another polygon of the collection; later envelope-disjoint elements are skipped and their boundary is never recorded, so EB or BE is F instead of 0 (line ends) or 1 (GC polygons) and the matrix depends on element order (POINT (10 10) vs MULTILINESTRING ((0 0, 1 0, 1 1, 0 0), (5 5, 6 6)): FF0FFF1F2, exact FF0FFF102; GEOMETRYCOLLECTION (POLYGON ((1 1, 2 1, 2 2, 1 2, 1 1)), POLYGON ((0 0, 3 0, 3 3, 0 3, 0 0))) vs LINESTRING (10 10, 11 11): FF2FFF102, exact FF2FF1102); relatePattern is affected, the named predicates are not"
