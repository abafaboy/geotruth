notes = "New bug; no duplicate found in libgeos/geos, locationtech/jts or shapely/shapely (open and closed), confirmed by an independent skeptic review. FINAL.md (GEOS) and JTS_FINAL.md (JTS, NPE + wrong IM) are ready but not posted. Regression framing: crash 1 replaced a correct answer (3.11.4), crash 2 replaced RelateOp's IllegalArgumentException (#983, open); the wrong matrices are older than RelateNG, and 'same cause as crash 2' holds only for RelateNG (GEOS 3.13+, JTS RelateNG). Which named predicates crash depends on the operand; entrypoints.c and output_entrypoints_*.txt list every relate/pattern/named/prepared C API entry point with EMPTY-free controls. In JTS only RelateNG API callers or -Djts.relate=ng are affected. Prototype fix (prototype_fix.diff: skip empty polygons in AdjacentEdgeLocator::addRings; TopologyComputer::getDimension returns getDimensionReal; built on a copy of the main ae9cdd98b tree, local snapshot commit 12d720e, identical apart from the two files) passes GEOS ctest 535/535 and JTS relateng JUnit 154/154, removes all 13 crashes of a 25,000-case regeneration and changes no previously exact answer. The pinned GEOS_CRASHES and EMPTY_ELEMENT_DIMENSION cases in tests/crosscheck/test_relate_dual.py belong to this finding, and so does the leads.toml lead relateng-empty-operand-type-dimension (POINT EMPTY vs GC(POLYGON EMPTY, LINESTRING): FFFFFF212, exact FFFFFF102; in RelateNG the same initExteriorEmpty declared-dimension cause, fixed by the same patch; case lead-relateng-empty-operand-type-dimension in cases.jsonl). The finding did not grow out of that lead (it came from GEOS_CRASHES), but it subsumes it. The lead relateng-gc-polygon-with-exterior-point is a different defect (no EMPTY element; unchanged by the patch). geos-relateng-geometrycollection-semantics's D1 fix also corrects the wrong-matrix case by another route, and its D2 patch touches AdjacentEdgeLocator next to this fix (rebase needed for whichever lands second). families: the corpus family \"empty\" is where the subsumed lead's case comes from (corpus/cases/core/empty.jsonl); the crashes themselves were found by the adversarial generator of tools/crosscheck_relate.py (13 in 25,000 cases), which is not a corpus family, and cases.jsonl labels its minimal cases gc-empty-element. cases.jsonl and scan_crashes.jsonl are v2 typed-JSON case records (geotruth.io.case_from_json reads them) with the WKT kept in a_wkt/b_wkt. GEOS 3.12.x and 3.13.0 were not run; PostGIS was not tested. GEOS has no security policy or private reporting channel (checked 2026-09-26), so under SECURITY.md the report goes to its public tracker."

