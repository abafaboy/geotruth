library = ["clipper2"]
status = "unreviewed"
source = "corpus/curated/leads.toml"
signature = "PolyTree64 nesting disagrees with the flat Paths64 result on touching rings: an inscribed hole comes back as a second top-level (clockwise) polygon, an island on its hole's boundary as a second hole"

[[lead]]
id = "boost-overlay-ring-structure"
library = ["boost-1.83", "boost-develop", "boost-release"]
status = "unreviewed"
source = "corpus/curated/leads.toml"
signature = "overlay output rings nested or oriented other than the multi_polygon says: read as OGC polygons (shell minus holes) the area is off by more than 1e-6 of the operands"

[[lead]]
id = "martinez-xor-hang"
library = ["martinez"]
status = "unreviewed"
source = "corpus/curated/leads.toml"
