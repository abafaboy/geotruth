[[lead]]
id = "relateng-gc-polygon-with-exterior-point"
library = ["geos-main", "geos-release", "shapely"]
status = "unreviewed"
source = "corpus/curated/leads.toml"
signature = "B = GeometryCollection(Polygon P, Point outside P), A = P: relate(A, B) = 2F2F110F2 (exact 2FFF1F0F2), as if B's polygon were absent; within/covered_by false, overlaps true. A Point inside P, a LineString outside P, or a second Polygon do not trigger it"

[[lead]]
id = "turf-touches-overlaps-vertex-rules"
library = ["turf"]
status = "unreviewed"
source = "corpus/curated/leads.toml"
signature = "booleanTouches(A, A) is true for a polygon and itself, and false for two triangles that touch only where a vertex of B lies on an edge of A (the README: booleanTouches only looks at A's shell vertices; booleanOverlap is true as soon as edges intersect)"

[[lead]]
