notes = "Confirmed at triage and by an independent review; not yet reported. FINAL.md is the report drafted for libgeos/geos; it inlines prototype_fix.diff verbatim (applies to ae9cdd98). All three defects are in StructuredCollection (src/geom/HeuristicOverlay.cpp): doSymDifference computes one-sided DIFFERENCE for lines and points (lines 505-528); doDifference subtracts A's own lines instead of a.getLineUnion() from A's points (lines 488-491); the dimension of an operand without non-empty elements stays Dimension::DONTCARE (HeuristicOverlay.h:67), so OverlayUtil::createEmptyResult(-3) asserts. Contract: cases 1a, 1b, 1e, 3a-3c meet even OverlayNG's own input requirements (simple GCs) and GEOS*Prec_r(..., 0) gets them right; the mixed-GC cases are supported by the public API since 3.12 (NEWS 3.12.0 'Support mixed GeometryCollection in overlay ops (GH-797)', implemented by PR #923 'Overlay with mixed dimension'), and the C API documents no restriction (the C++ Geometry.h '@throws IllegalArgumentException for a non-empty GeometryCollection' is stale). D1 on mixed GCs, D2, D4 and D5 date from #923 (3.12.0); D3 and D1 on simple polygonal GCs from #1229 (3.14.0, backported to 3.12.3 and 3.13.1). Regression scope: accurate for 1a, 1b, 1e and D3 (since 3.12.3/3.13.1/3.14.0) and for everything relative to 3.11.4; GC overlay on main is not worse overall than on 3.13.0, which threw 1356 TopologyExceptions in the 7872-result scan where main throws none. Two further mechanisms are documented in ISSUE.md but not claimed as contract violations: D4 (the GC's lines are pre-noded on their own in floating point, so rounded nodes lose exact coincidences: POINT(3 2) and GC(MULTILINESTRING((0 2,2 4),(0 4,6 0)), POINT(9 9)) intersect to POINT EMPTY), and D5 (a nested GEOMETRYCOLLECTION EMPTY makes a lineal GC 'mixed-dimension': clear IllegalArgumentException). The lead's cases in tests/crosscheck/test_overlay_crosscheck.py (GEOS_GC_OVERLAY, GEOS_GC_EMPTY_ASSERTION) are D1, D2 and D3. Upstream search: no duplicate on GitHub (libgeos/geos issues and PRs, shapely, jts); duckdb/duckdb-spatial#803 is a downstream report of D3. PostGIS trac was not searched (the egress proxy blocks trac.osgeo.org). libgeos/geos#948 is still open although its input has given the correct result since 3.13.1 (#1229); FINAL.md suggests it may be possible to close it. Different problems, checked: #696/#716 (OverlayNG simple-GC support, 3.12.0), #1023/#1050 (3.9 branch), #1059 (representation of an intersection with a GC of adjacent squares), #1316 (no GC); jts#667 and jts#833 are open JTS proposals for GC support (context only). families: the superseded lead's cases are corpus family 'empty'; the other cases come from the adversarial generator of tools/crosscheck_overlay.py. Nothing has been posted."

