atches on the 1804-case set (int-grid-7-000041, tiny-rotation-1-000108/179) and the fuzz near-miss (A=(-51,59)(-41,24)(-26,-21), B=(-49,52)(-37,12)(-41,27): Difference 16.5, exact 27.5) are flat-result integer-grid effects, not this finding, untriaged."

