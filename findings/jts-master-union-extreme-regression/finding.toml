# Proposed entry for findings/registry.toml (this file does not edit the registry; same keys as
# registry entries). The triage found two separate defects. Following the registry convention
# (one [[finding]] per directory, several defects named in the signature), both share this entry:
# D1, the lead's master regression (FINAL.md), and D2, the OverlayMixedPoints ClassCastException
# (mixed-points/FINAL.md, with its own cases.jsonl, Repro.java and prototype_fix.diff). D2 could
# move to a findings/ directory of its own later.

[[finding]]
id = "jts-master-union-extreme-regression"
library = "jts-main"
lib = "jts@1.21.0-SNAPSHOT-3ea61f8"
signature = "overlay, two independent JTS defects. (D1, regression on master only) since #1114 (4668803) KdTree.insertExact compares p.distanceSq(node) <= toleranceSq, and toleranceSq = tolerance^2 is +Infinity for a snap tolerance above 1.34e154; when an OverlayNGRobust overlay with large coordinates falls back to snapping (forced here because Geometry.getArea() overflows to NaN and the area check fails; tolerance = magnitude/1e12, times 10 per try), snapSelf merges every vertex and union, intersection, difference and symdifference return POLYGON EMPTY with no exception: OverlayNGRobust.overlay(A, A, UNION) for A = POLYGON ((0 0, 2e170 1e170, 1e170 2e170, 0 0)) is POLYGON EMPTY (exact: A), and new KdTree(1e155) merges (0 0) and (1e300 0). (D2, JTS 1.18.0 to master; 1.18.0 throws IllegalArgumentException instead) OverlayMixedPoints.extractPolygons casts every element of the non-strictly noded polygonal operand to Polygon, so union and symdifference of a polygonal geometry and a point throw ClassCastException 'LineString cannot be cast to Polygon' when a polygon collapses to a line under the precision model: OverlayNG.overlay(MULTIPOLYGON (((0 0, 2 0, 2 2, 0 2, 0 0)), ((3 0, 5 0, 5 0.4, 3 0))), POINT (7 7), UNION, new PrecisionModel(1)) throws (expected GEOMETRYCOLLECTION (POLYGON ((0 0, 0 2, 2 2, 2 0, 0 0)), LINESTRING (3 0, 5 0), POINT (7 7)))"
fields = ["overlay.union", "overlay.intersection", "overlay.difference", "overlay.symdifference"]
families = ["line-polygon", "point-geometry"]
status = "confirmed"
status_date = "2026-09-26"
verified_on = [
    "D1: JTS master 3ea61f8cf2103f454c9cf3962df75fb6ef3ebecd (head on 2026-09-26): wrong (POLYGON EMPTY from max |ordinate| of about 1.3e162, measured for these inputs)",
    "D1: JTS 1.20.0 (6e95fe82feb986a7aa657f4ffa406d8c290af509): correct",
    "D1: bisected to 4668803bdf3c460c1ab35f8c0ba00752e0b3edd4 (#1114) on the corpus case at 3.8e220; the minimal triangle is also correct at 4668803^ and empty at 4668803. The corpus case scaled to 1.5e162 bisects to 52c5d988 (#1187), which for that input only removes a ring rotation that let it pass the area check; the minimal triangle is empty from 2^538 already at 4668803 and 52c5d988^ (bisect/output_history.txt)",
    "D1: JTS master 3ea61f8 + prototype_fix.diff: correct (exact or snap-rounded); core JUnit results unchanged; 3 new tests pass",
    "D1: default Geometry.union (SnapIfNeededOverlayOp): correct on both builds for these inputs; Geometry.union with -Djts.overlay=ng: wrong on master",
    "D1 context, not part of the regression: KdTree(0.0) merges (0 0) and (1e-170 0) (squared-distance underflow) on master, at aa755818 (#1112), at 4668803^ and in 1.18.0; aa755818^ and 1.20.0 keep 2 nodes (bisect/output_history.txt)",
    "D2: JTS master 3ea61f8 and 1.20.0: ClassCastException for UNION and SYMDIFFERENCE, both argument orders, strict mode too; also through OverlayNGRobust.overlay with a fixed-PrecisionModel GeometryFactory, through A.union(P) and A.symDifference(P) with -Djts.overlay=ng, and with POINT EMPTY as the point operand",
