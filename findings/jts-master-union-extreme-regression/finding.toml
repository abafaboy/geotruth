notes = "Confirmed at triage and by an independent review; not yet reported. One directory, two reports for locationtech/jts: FINAL.md (D1) and mixed-points/FINAL.md (D2, whose cases, repro and prototype fix are in mixed-points/); ISSUE.md is the full triage. No priority key because the entry covers both defects. D1 alone is low priority: it needs |ordinates| above about 1.3e162 (for these inputs) or a KdTree tolerance above 1.34e154, JTS documents no coordinate range, and the open, unmerged PR #1197 describes DD orientation as sound only for |coordinates| in about [2^-511, 2^511], so upstream may call such inputs out of range; it is still a silent wrong answer, a regression from 1.20.0 in unreleased code, with a one-line fix. D2 is normal priority: valid input with small, ordinary coordinates (0 to 7), through the documented fixed-PrecisionModel API. Both corpus cases need extreme coordinates (line-polygon-1-000090 at 3.8e220 for D1; point-geometry-1-000016 at about 1e-161 for D2, where the known orientation underflow of geos-tiny-coordinates-underflow collapses the small triangle), but neither defect is that mechanism. The tolerance-0 KdTree merge at the tiny end is older than #1114 (on master since #1112, whose MathUtil.hypot is a deliberate speed trade-off; also in 1.19.0 and earlier; only 1.20.0, with #923's Math.hypot, avoids it), so FINAL.md gives it as context and not as part of the regression. Related, none a duplicate: #1114, #1112/#1110, #923, #1187, #951, #1197, #295, #1133, geos#931, NTS#814 and PR NTS#848 (they port nearestNeighbor only, so NTS is unaffected for now), and GEOS 095c7270 (strict noding in 3.15+, not a fix for D2). NTS has the same (Polygon) cast as D2 (not run)."
