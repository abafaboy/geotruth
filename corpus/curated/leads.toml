[[lead]]
id = "turf-touches-overlaps-vertex-rules"
library = ["turf"]
lib = ["turf@7.4.0"]
signature = "booleanTouches(A, A) is true for a polygon and itself, and false for two triangles that touch only where a vertex of B lies on an edge of A (the README: booleanTouches only looks at A's shell vertices; booleanOverlap is true as soon as edges intersect)"
fields = ["touches", "overlaps"]
status = "unreviewed"
upstream_issue = ""
upstream_status = "not checked"
documented_in = "adapters/js/README.md (Library quirks found while building this: Turf predicates)"
verified_on = ["turf 7.4.0: reproduces on both minimal cases"]
notes = "Turf documents tolerance-based and vertex-based predicate rules; triage should decide whether these cases are within Turf's contract."

