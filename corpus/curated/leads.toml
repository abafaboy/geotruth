signature = "B = GeometryCollection(Polygon P, Point outside P), A = P: relate(A, B) = 2F2F110F2 (exact 2FFF1F0F2), as if B's polygon were absent; within/covered_by false, overlaps true. A Point inside P, a LineString outside P, or a second Polygon do not trigger it"
fields = ["relate", "predicates.within", "predicates.covered_by", "predicates.overlaps", "predicates.contains", "predicates.covers"]
status = "unreviewed"
upstream_issue = ""
upstream_status = "not checked"
documented_in = "corpus/cases/core/gc.jsonl (found by the gc family, minimised with geotruth minimize)"
verified_on = [
    "GEOS main ae9cdd9: reproduces",
    "GEOS 3.15.0: reproduces",
    "GEOS 3.13.1 (Shapely 2.1.2): reproduces",
    "JTS master 3ea61f8, RelateNG (TestRunner -Djts.relate=ng on the geotruth export, and the v2 adapter): reproduces",
    "JTS 1.20.0, RelateNG (v2 adapter): reproduces",
    "JTS master 3ea61f8, old RelateOp: unsupported (IllegalArgumentException for GeometryCollection arguments)",
]
notes = "Found while cross-checking the new gc family against GEOS (2026-09-26). Both operands are valid (a GC is validated per element). The exact matrix agrees between the arrangement route (geotruth.relate) and the witness route (geotruth.relate_witness)."

[[lead.case]]
id = "gc-1-000733-nested.poly.ba.int.min"
family = "gc"
a = "POLYGON ((-81 -1468, -30 -2030, 82 -2089, -81 -1468))"
b = "GEOMETRYCOLLECTION (POLYGON ((-81 -1468, -30 -2030, 82 -2089, -81 -1468)), POINT (-710 -1147))"
parent = "gc-1-000733-nested.poly.ba.int"
minimised_with = "geotruth minimize corpus/cases/core/gc.jsonl#gc-1-000733-nested.poly.ba.int --lib geos-main --field relate"
case_notes = "minimised 16 -> 9 coordinates, 108 -> 55 digits; geos-main: 2F2F110F2, exact 2FFF1F0F2"

