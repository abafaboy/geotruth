# Curated leads: documented candidate bugs, as they were recorded before triage.
#
# The curated tier (corpus/cases/curated.jsonl, built by `geotruth corpus build --tier
# curated`) holds the minimal case of every finding in findings/registry.toml, and the cases
# below. A lead is NOT a confirmed bug (DESIGN §0.4): every lead here has status
# "unreviewed" until a person triages it and it moves to findings/registry.toml.
#
# Leads that triage has since turned into findings stay here unchanged, so that the curated
# tier keeps their original cases next to the finding's minimal ones; the finding's registry
# entry names the lead in `supersedes_lead`, and the registry lists as [[lead]] only the
# leads that no finding supersedes.
#
# Keys of a [[lead]] (as in findings/registry.toml where they overlap):
#   id, library (adapter target ids), lib, signature, fields, status, upstream_issue,
#   upstream_status ("not checked": the upstream tracker has not been searched yet;
#   "reported" once upstream_issue is set), documented_in (where the lead is described),
#   verified_on (library
#   builds the case was run on here, and what happened), notes.
# Keys of a [[lead.case]]:
#   id; either `from` (a tracked case file; the case with that id, or `source_id`) or
#   inline `a`/`b` WKT with shortest round-trip doubles; optional family, parent (the case
#   it was minimised from), minimised_with (the command), case_notes.
#
# verified_on was checked on 2026-09-26 with the adapters in adapters/ against the exact
# answer (geotruth relate engine; overlay areas from tests/reference/oracle.py).
leads_version = 1


