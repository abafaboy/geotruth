# Publishes a GitHub release when a version tag (v*) is pushed, or completes one created in
# the web interface (which pushes its tag): the notes come from RELEASE_NOTES_<tag>.md and
# the assets are attached. Nothing here is taken on trust: the assets are published only if
# the tag matches the package version, the unit tests pass, and the full tier regenerated
# from the generators, together with its exact answers recomputed by the engine, matches the
# sha256 recorded in corpus/MANIFEST.json and corpus/expected/MANIFEST.json. Assets: the
# sdist and wheel, and the full tier (cases and expected answers, CC0), which is too large
# for git.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  release:
    name: build, verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install geotruth
        run: python -m pip install -e ".[dev]" build "shapely==2.1.2"
      - name: The tag names the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import geotruth; print(geotruth.__version__)')"
          echo "tag $TAG, package $version"
          test "$TAG" = "v$version"
          test -f "RELEASE_NOTES_$TAG.md"
      - name: Unit tests
        run: make unit PYTHON=python PYTEST_ARGS="-q"
      - name: Regenerate the full tier and check it against corpus/MANIFEST.json
        run: |
          python -m geotruth corpus build --tier full
          git diff --exit-code -- corpus/MANIFEST.json corpus/SHA256SUMS
          python -m geotruth corpus verify
      - name: Recompute the full tier's exact answers and check them against the manifest
        run: |
          python -m geotruth expect --tier full --jobs 4 --no-cache --quiet
          git diff --exit-code -- corpus/expected/MANIFEST.json
          python - <<'EOF'
          import hashlib, json
          entry = json.load(open("corpus/expected/MANIFEST.json"))["files"]["full.jsonl"]
          digest = hashlib.sha256(open("corpus/expected/full.jsonl", "rb").read()).hexdigest()
          assert digest == entry["sha256"], (digest, entry["sha256"])
          print("full.jsonl", digest, entry["records"], "records")
          EOF
      - name: Build the sdist, the wheel and the full-tier archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m build
          tar -czf "dist/geotruth-corpus-full-$TAG.tar.gz" \
            corpus/cases/full corpus/expected/full.jsonl \
            corpus/MANIFEST.json corpus/expected/MANIFEST.json corpus/LICENSE
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # created in the web interface: attach the checked assets and the notes
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "geotruth ${TAG#v}" \
              --notes-file "RELEASE_NOTES_$TAG.md"
          else
            gh release create "$TAG" dist/* \
              --title "geotruth ${TAG#v}" \
              --notes-file "RELEASE_NOTES_$TAG.md" \
              --verify-tag
          fi
